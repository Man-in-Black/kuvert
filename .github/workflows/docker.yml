# Baut bei jedem Push auf main (und bei Versions-Tags v*) das Docker-Image
# für amd64 und arm64 und veröffentlicht es in der GitHub Container Registry:
#   ghcr.io/<besitzer>/kuvert:latest   (main)
#   ghcr.io/<besitzer>/kuvert:1.2.3    (Tag v1.2.3)
#   ghcr.io/<besitzer>/kuvert:sha-…    (jeder Build)
name: Docker-Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typprüfung & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Image bauen & veröffentlichen
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image-Namen bestimmen (Registry verlangt Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kuvert" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Bei ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Kuvert
            org.opencontainers.image.description=Selbst gehosteter Web-Client für E-Mail, Kalender, Kontakte und Aufgaben

      - name: Bauen (amd64 + arm64) und hochladen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
