services:
  kuvert:
    # Fertiges Image aus der GitHub Container Registry (amd64 + arm64).
    # Selbst bauen: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/man-in-black/kuvert:${KUVERT_VERSION:-latest}
    container_name: kuvert
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      MEILI_URL: http://meilisearch:7700
    volumes:
      - kuvert-data:/data
    depends_on:
      - meilisearch

  # Volltext-Suchindex für die Suche über alle Konten (nur intern erreichbar)
  meilisearch:
    image: getmeili/meilisearch:v1.58
    container_name: kuvert-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Bitte MEILI_MASTER_KEY in der .env setzen (z. B. mit openssl rand -hex 32)}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data

  # Lokales LLM für den KI-Assistenten (optional):
  #   docker compose --profile ai up -d
  #   docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    container_name: kuvert-ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # NVIDIA-GPU nutzen (nvidia-container-toolkit erforderlich):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  kuvert-data:
  meili-data:
  ollama-models:
